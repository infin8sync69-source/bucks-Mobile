# Pull-request check for the database: applies schema.sql and every migration in apply_all.sh's order to a fresh PostgreSQL + PostGIS,
# then runs catalog_assertions.sql and every scenario suite (supabase/tests/run_all.sh). Touches no Supabase project.
name: Database CI

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-ci.yml'
  workflow_dispatch:

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Apply the stack and run every suite
        run: bash supabase/tests/run_all.sh
