# Builds the signed iOS app and uploads it to App Store Connect (TestFlight). Run it by hand: Actions > iOS release (App Store) > Run workflow.
# Signing is cloud-managed: Xcode creates the distribution certificate and profile itself through the App Store Connect API key, so no
# certificate or profile is stored here. One-time setup and the secrets below: docs/IOS_RELEASE.md.
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8_B64   App Store Connect API key (role: Admin; cloud signing needs it)
#   APPLE_TEAM_ID                                                         the 10-character team id
#   GOOGLE_SERVICE_INFO_PLIST_B64                                         Firebase's iOS config file (GoogleService-Info.plist), base64
#   SUPPORT_EMAIL, GRIEVANCE_OFFICER                                      shown in Help, as on Android (a warning when empty)
name: iOS release (App Store)

on:
  # Pushing a tag ios-v<version> (e.g. ios-v1.0.0) also releases, so it works from any branch before this file is on main.
  # release-v<version> releases iOS and Android together from the same commit (android-release.yml listens to it too).
  push:
    tags: ['ios-v*', 'release-v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store, e.g. 1.0.0"
        required: true
      build:
        description: "Build number (must be higher than the last upload; empty = this run's number)"
        required: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      GRIEVANCE_OFFICER: ${{ secrets.GRIEVANCE_OFFICER }}
      VERSION: ${{ inputs.version || ((startsWith(github.ref, 'refs/tags/ios-v') || startsWith(github.ref, 'refs/tags/release-v')) && github.ref_name) }}
      BUILD: ${{ inputs.build || github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the secrets are set
        run: |
          VERSION="${VERSION#ios-v}"; VERSION="${VERSION#release-v}"; echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"   # a step-level copy: a job-level env value may win over GITHUB_ENV
          missing=""
          for v in APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_B64 APPLE_TEAM_ID GOOGLE_SERVICE_INFO_PLIST_B64 SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing repository secrets:$missing (see docs/IOS_RELEASE.md)"; exit 1; }
          if [ -z "$SUPPORT_EMAIL" ]; then echo "::warning::No SUPPORT_EMAIL secret: Help has no contact address (it points to the grievance page instead)."; fi
          if [ -z "$GRIEVANCE_OFFICER" ]; then echo "::warning::No GRIEVANCE_OFFICER secret: Help shows no grievance officer (only the grievance page)."; fi
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || { echo "::error::version must look like 1.0 or 1.0.0"; exit 1; }
          printf '%s' "$BUILD" | grep -Eq '^[0-9]+$' || { echo "::error::build must be a whole number"; exit 1; }
      - name: Xcode 26
        # App Store Connect only accepts builds made with the iOS 26 SDK or later; the runner's default Xcode can be older.
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$x" ] || { ls -d /Applications/Xcode*.app; echo "::error::no Xcode 26 on this runner image"; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: XcodeGen
        run: brew install xcodegen
      - name: Config and Firebase file
        run: |
          # xcconfig reads // as a comment, so the scheme's slashes are spelled with $() (as scripts/make_secrets.sh does)
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > App/GoogleService-Info.plist
          plutil -lint App/GoogleService-Info.plist
          # Phone sign-in comes back through REVERSED_CLIENT_ID, or, in newer config files that lack it, the encoded app id
          # (GOOGLE_APP_ID 1:N:ios:H becomes app-1-N-ios-H), as Firebase's phone-auth guide says.
          rev="$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' App/GoogleService-Info.plist 2>/dev/null || true)"
          [ -n "$rev" ] || rev="app-$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' App/GoogleService-Info.plist | tr ':' '-')"
          # Help's contact details are free text that may hold a link: every slash gets a $() after it (as scripts/make_secrets.sh does).
          xc() { printf '%s' "$1" | sed 's#/#/$()#g'; }
          printf 'SUPABASE_URL = %s\nSUPABASE_ANON_KEY = %s\nMAPBOX_TOKEN = %s\nREVERSED_CLIENT_ID = %s\nSUPPORT_EMAIL = %s\nGRIEVANCE_OFFICER = %s\n' \
            "$(printf '%s' "$SUPABASE_URL" | sed 's#//#/$()/#')" "$SUPABASE_ANON_KEY" "$MAPBOX_TOKEN" "$rev" "$(xc "$SUPPORT_EMAIL")" "$(xc "$GRIEVANCE_OFFICER")" > Config/Secrets.xcconfig
          xcodegen generate
      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPSTORE_API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" || { echo "::error::APPSTORE_API_KEY_P8_B64 is not a base64-encoded .p8 key"; exit 1; }
      - name: Archive
        # Signed locally ("-") so the entitlements (push, time-sensitive) are kept without a development profile: automatic signing
        # would want one, and Apple only makes it for a team with a registered device. Export below re-signs for the App Store
        # (distribution certificate and App Store profile, created through the API key; no devices needed).
        run: |
          set -o pipefail
          xcodebuild archive -project Bucks.xcodeproj -scheme Bucks -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bucks.xcarchive" -skipPackagePluginValidation \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { grep -E "error:" archive.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: The archive is a production build
        run: |
          app="$RUNNER_TEMP/Bucks.xcarchive/Products/Applications/Bucks.app"
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is missing from the archive"; exit 1; }
          key="$(/usr/libexec/PlistBuddy -c 'Print :GeminiAPIKey' "$app/Info.plist" 2>/dev/null || true)"
          [ -z "$key" ] || { echo "::error::the release build carries a Gemini key"; exit 1; }
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"; b="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          [ "$v" = "$APP_VERSION" ] && [ "$b" = "$BUILD" ] || { echo "::error::the app says $v ($b), expected $APP_VERSION ($BUILD)"; exit 1; }
          for k in SupportEmail GrievanceOfficer; do   # Help reads them (App Review guideline 1.2 asks for contact details)
            /usr/libexec/PlistBuddy -c "Print :$k" "$app/Info.plist" > /dev/null 2>&1 || { echo "::error::Info.plist has no $k (ios/project.yml)"; exit 1; }
          done
          ents="$(codesign -d --entitlements - --xml "$app" 2>/dev/null || true)"
          for e in aps-environment com.apple.developer.usernotifications.time-sensitive; do
            printf '%s' "$ents" | grep -q "$e" || { echo "::error::the archive lost the $e entitlement"; exit 1; }
          done
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Bucks.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" 2>&1 | tee export.log | tail -30
          grep -q "EXPORT SUCCEEDED" export.log || { echo "::error::upload to App Store Connect failed (see the log above)"; exit 1; }
          echo "Uploaded Bucks $APP_VERSION ($BUILD). It appears under TestFlight in App Store Connect after Apple finishes processing (10 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" App/GoogleService-Info.plist Config/Secrets.xcconfig
