# Builds the Google Play release: a minified Android App Bundle signed with the upload key, plus the R8 mapping file (upload it to
# Play Console with the bundle so crash reports are readable). Run it from the Actions tab ("Run workflow") with a version name, or
# push a tag like v1.0.0. Publishes nothing by itself: download the bundle and upload it to a Play Console track (internal testing first).
#
# Needs the UPLOAD_KEYSTORE_B64 and UPLOAD_KEYSTORE_PASSWORD secrets (scripts/setup-upload-signing.sh creates both), and Play App
# Signing switched on for the app in Play Console. The tester builds (android-build.yml) keep their own pilot key.
name: Android release (Play)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users, e.g. 1.0.0'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; else cp firebase/google-services.json app/google-services.json; fi
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "::error::No UPLOAD_KEYSTORE_B64 secret. Run scripts/setup-upload-signing.sh once."; exit 1; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          name="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.2.3 (got '$name')"; exit 1; fi
          # Play needs a larger version code for every upload: 1.2.3 becomes 10203xx, xx being this workflow's run number (mod 100).
          IFS=. read -r major minor patch <<<"$name"
          code=$(( (major * 10000 + minor * 100 + patch) * 100 + GITHUB_RUN_NUMBER % 100 ))
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"; echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version $name ($code)"
      - name: Build signed release bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY secrets for the production project."; exit 1; fi
          if [ -z "$MAPBOX_TOKEN" ]; then echo "::warning::No MAPBOX_TOKEN: maps would fall back to public OpenStreetMap servers, which do not allow production app traffic."; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bucks-play-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
