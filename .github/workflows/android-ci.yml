# Pull-request check for the Android app: builds the debug APK (live mode, like the tester builds) and keeps it as a workflow artifact
# for reviewers, then the minified release bundle (R8), so a Play release never meets a shrinker error for the first time.
# Publishes nothing: test builds are still released by android-build.yml, Play bundles by android-release.yml.
name: Android CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'firebase/google-services.json'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config
        run: cp firebase/google-services.json app/google-services.json
      - name: Build debug APK
        env:
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lboxctryrktwdsvywfqp.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxib3hjdHJ5cmt0d2Rzdnl3ZnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Nzg4NjgsImV4cCI6MjEwNjA1NDg2OH0.f723OaejTwcD3AZsASkaF6XYLMIhYmdIqVWphasImcg' }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          # Surface Kotlin compile errors as annotations so they show on the pull request.
          ./gradlew assembleDebug 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          grep -E "^e: |What went wrong|Could not resolve" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: bucks-android-pr-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # The Play build: minified and shrunk by R8, unsigned here (android-release.yml signs it with the upload key).
      - name: Build release bundle (R8)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lboxctryrktwdsvywfqp.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxib3hjdHJ5cmt0d2Rzdnl3ZnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Nzg4NjgsImV4cCI6MjEwNjA1NDg2OH0.f723OaejTwcD3AZsASkaF6XYLMIhYmdIqVWphasImcg' }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          ./gradlew bundleRelease 2>&1 | tee release.log; status=${PIPESTATUS[0]}
          grep -E "^e: |What went wrong|ERROR:|Missing class" -A3 release.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          # R8 writes the keep rules it would need; show them so they can be copied into proguard-rules.pro.
          find app/build -name missing_rules.txt -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null | head -80
          exit "$status"
