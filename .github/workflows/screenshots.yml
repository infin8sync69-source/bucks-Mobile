# Runs the demo build on an emulator, walks the rider flow and publishes the screenshots as a release.
name: App screenshots

on:
  push:
    branches: [pilot-release-fixes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (demo mode)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/screenshots.sh
      - name: Publish screenshots
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screens-${{ github.run_number }}
          name: Screenshots ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Emulator screenshots of ${{ github.sha }} (demo mode)."
          files: shots/*.png
